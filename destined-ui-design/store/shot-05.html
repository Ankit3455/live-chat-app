<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1080">
<title>Store 05 · Say hi with your voice — Destined</title>
<link rel="stylesheet" href="../css/design-system.css">
<link rel="stylesheet" href="store.css">
<style>
  /* from screens/screen-06-chat.html (conversation) */
  .chatbar { height: 60px; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid var(--border); background: var(--bg-elev); flex: none; position: relative; z-index: 3; }
  .chatbar .who { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .chatbar .who b { font: 600 16px/1.2 var(--font-body); display: block; }
  .chatbar .who small { font-size: 12px; color: var(--online); }
  .bg2 { background-color: #7A2160; }
  .voice-b { display: flex; align-items: center; gap: 10px; min-width: 200px; }
  .voice-b .pp { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; flex: none; }
  .voice-b .pp svg { width: 14px; height: 14px; }
  .voice-b .w { flex: 1; height: 22px; display: flex; gap: 2px; align-items: center; }
  .voice-b .w i { flex: 1; background: rgba(255,255,255,.75); border-radius: 2px; }
  .voice-b.playing .w i { background: rgba(255,255,255,.35); }
  .voice-b.playing .w i.on { background: var(--pink-300); }
  .read { color: #E9D5FF; }
  .composer .ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text-muted); flex: none; }
  .composer .ib svg { width: 22px; height: 22px; }
  .screen { padding-top: 4px; }

  /* Floating profile voice-intro card (from screens/screen-04-profile.html voice card) */
  .float { position: absolute; left: 52px; top: 1430px; width: 620px; z-index: 3; padding: 26px 30px; border-radius: 34px;
    background: rgba(30,21,49,.94); border: 1.5px solid rgba(249,168,212,.35); box-shadow: 0 28px 70px rgba(4,1,10,.6), 0 0 60px rgba(236,72,153,.22);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .float .top { display: flex; align-items: center; gap: 18px; }
  .float .avatar { width: 72px; height: 72px; background-color: #7A2160; }
  .float .top b { display: block; font: 700 30px/1.2 var(--font-display); }
  .float .top small { font: 500 24px var(--font-body); color: var(--text-muted); }
  .float .row2 { display: flex; align-items: center; gap: 20px; margin-top: 22px; }
  .float .play { width: 72px; height: 72px; border-radius: 50%; background: var(--grad-primary); display: grid; place-items: center; flex: none; box-shadow: var(--shadow-glow); }
  .float .play svg { width: 30px; height: 30px; color: #fff; }
  .float .wave { flex: 1; height: 50px; display: flex; align-items: center; gap: 5px; }
  .float .wave i { flex: 1; border-radius: 3px; background: var(--violet-300); opacity: .45; }
  .float .wave i.on { opacity: 1; background: var(--pink-300); }
  .float .dur { font: 600 24px var(--font-body); color: var(--text-muted); font-variant-numeric: tabular-nums; }
</style></head>
<body>
<script src="../assets/icons.js"></script>
<div class="shot">
  <div class="stars"></div>
  <span class="sparkle" style="top:100px;right:100px"></span>
  <span class="sparkle gold sm" style="top:530px;left:110px"></span>
  <span class="sparkle sm" style="top:1100px;right:64px"></span>

  <header class="shot-head">
    <div class="brand"><svg><use href="#i-moon"/></svg>Destined</div>
    <h1 class="shot-title">Say hi with<br><span class="hl">your voice</span></h1>
    <p class="shot-sub">Hear them before you meet them.</p>
  </header>

  <div class="phone-wrap">
  <div class="device">
    <div class="statusbar"><span>9:41</span><span class="icons"><i></i><i></i></span></div>
    <div class="chatbar">
      <button class="icon-btn" aria-label="Back"><svg><use href="#i-back"/></svg></button>
      <div class="who"><div class="avatar sm bg2" style="background-image:url('https://api.dicebear.com/9.x/avataaars/svg?seed=Meera&top=bob,bun,curly,curvy,longButNotTooLong,straight01,straight02,bigHair,frida,straightAndStrand&facialHairProbability=0')"><span class="presence"></span></div><div><b>Meera</b><small>Online</small></div></div>
      <button class="icon-btn" aria-label="Voice call"><svg><use href="#i-phone"/></svg></button>
      <button class="icon-btn" aria-label="Video call"><svg><use href="#i-video"/></svg></button>
      <button class="icon-btn" aria-label="Chat options"><svg><use href="#i-more"/></svg></button>
    </div>
    <div class="screen">
      <div class="day-sep"><span>Today</span></div>
      <div class="bubble-row me"><div class="bubble me">Your voice intro made me smile 😄 That laugh!<div class="meta">8:12 PM <svg class="read" aria-label="Read"><use href="#i-check2"/></svg></div></div></div>
      <div class="bubble-row"><div class="bubble them">Haha thank you! Sending you the Saturn story 🪐<div class="meta">8:13 PM</div></div></div>
      <div class="bubble-row"><div class="bubble them"><div class="voice-b playing"><span class="pp"><svg><use href="#i-pause"/></svg></span><span class="w"><i class="on" style="height:40%"></i><i class="on" style="height:80%"></i><i class="on" style="height:55%"></i><i class="on" style="height:95%"></i><i class="on" style="height:60%"></i><i style="height:35%"></i><i style="height:70%"></i><i style="height:45%"></i><i style="height:85%"></i><i style="height:50%"></i><i style="height:30%"></i><i style="height:65%"></i></span><span style="font-size:12px">0:07</span></div><div class="meta">8:14 PM</div></div></div>
      <div class="bubble-row me"><div class="bubble me"><div class="voice-b"><span class="pp"><svg><use href="#i-play"/></svg></span><span class="w"><i style="height:35%"></i><i style="height:60%"></i><i style="height:90%"></i><i style="height:50%"></i><i style="height:70%"></i><i style="height:40%"></i><i style="height:80%"></i><i style="height:55%"></i><i style="height:30%"></i><i style="height:65%"></i><i style="height:45%"></i><i style="height:75%"></i></span><span style="font-size:12px">0:21</span></div><div class="meta">8:16 PM <svg class="read"><use href="#i-check2"/></svg></div></div></div>
    </div>
    <div class="composer">
      <button class="ib" aria-label="Attach photo or file"><svg><use href="#i-plus"/></svg></button>
      <div class="box">Message Meera…</div>
      <button class="send" aria-label="Record voice message"><svg><use href="#i-mic"/></svg></button>
    </div>
    <div class="home-indicator"></div>
  </div>
  </div>

  <div class="float" aria-label="Meera's voice intro, 24 seconds">
    <div class="top">
      <div class="avatar" style="background-image:url('https://api.dicebear.com/9.x/avataaars/svg?seed=Meera&top=bob,bun,curly,curvy,longButNotTooLong,straight01,straight02,bigHair,frida,straightAndStrand&facialHairProbability=0')"></div>
      <div><b>Meera’s voice intro</b><small>On her profile</small></div>
    </div>
    <div class="row2">
      <span class="play"><svg><use href="#i-play"/></svg></span>
      <span class="wave" aria-hidden="true"><i class="on" style="height:40%"></i><i class="on" style="height:70%"></i><i class="on" style="height:55%"></i><i class="on" style="height:90%"></i><i class="on" style="height:60%"></i><i class="on" style="height:35%"></i><i style="height:75%"></i><i style="height:50%"></i><i style="height:85%"></i><i style="height:40%"></i><i style="height:65%"></i><i style="height:30%"></i><i style="height:55%"></i><i style="height:80%"></i><i style="height:45%"></i><i style="height:60%"></i><i style="height:35%"></i><i style="height:70%"></i></span>
      <span class="dur">0:24</span>
    </div>
  </div>
</div>
</body></html>
