name: availchat
description: AvailChat - Dating/Chat app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.3.8
  firebase_database: ^11.3.5
  firebase_crashlytics: ^4.1.3
  firebase_app_check: ^0.3.2  # App Check client (DEST-112/DEST-051); activated in main.dart
  cloud_functions: ^5.2.0

  # State Management
  provider: ^6.1.2

  # 🆕 NEW - WebRTC & Call Features
  flutter_webrtc: ^1.2.0
  wakelock_plus: ^1.1.4
  uuid: ^4.3.3  # For generating call IDs
  flutter_local_notifications: ^19.5.0

  # Permissions
  permission_handler: ^11.4.0

  # Images
  image_picker: ^1.1.1

  # Location
  geolocator: ^10.1.0

  # HTTP
  http: ^1.1.0
  http_parser: ^4.0.2  # MediaType in cloudinary_storage_repo (was transitive)
  url_launcher: ^6.3.1  # Settings: Privacy/Terms/Support links (DEST-034)

  # Google Sign In
  google_sign_in: ^6.3.0

  # ML Kit
  google_mlkit_translation: ^0.10.1

  # UI
  cupertino_icons: ^1.0.6
  lottie: ^3.1.2  # ✅ ADD THIS
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_slidable: ^3.1.0
  shimmer: ^3.0.0
  animated_text_kit: ^4.3.0

  # Utils
  intl: ^0.18.1
  shared_preferences: ^2.3.3  # ← ADD THIS for ProfileCompletionManager
  geocoding: ^3.0.0           # ← ADD THIS for location geocoding
  audioplayers: ^6.1.0
  tutorial_coach_mark: ^1.3.3

  # recording:
  record: ^6.1.2
  path_provider: ^2.1.4

  #Notification
  onesignal_flutter: ^5.3.4

  #Avatar
  flutter_svg: ^2.0.0
  flutter_image_compress: ^2.3.0


  # Game dependency:
  flame: ^1.34.0
  # Chat games UI: animations, win confetti, chess piece vectors.
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  chess_vectors_flutter: ^1.1.0
  # Emoji panel in the chat composer.
  emoji_picker_flutter: ^4.4.0
  flame_forge2d: ^0.19.2+2
  simple_ripple_animation: ^0.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    # Animations
    - assets/animations/
    - assets/animations/zodiac.json
    - assets/animations/star_animation.json
    - assets/animations/space.json

    # Images - main folder
    - assets/images/

    # Images - subfolders (ADD THESE!)
    - assets/images/dice/
    - assets/images/crown/

    # Sounds (ADD THIS!)
    - assets/sounds/
