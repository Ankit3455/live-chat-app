# Analyzer and lint configuration. Run with `flutter analyze`.
# CI fails on errors and warnings; lint findings (infos) are reported but
# not fatal yet. Promote a rule to `warning` under `analyzer.errors` once its
# existing findings are fixed.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - functions/**
    - test/rules/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/firebase_options.dart
  errors:
    # Keep these fatal in CI (they are warnings by default; pinned here so a
    # lints package update cannot downgrade them).
    unused_import: warning
    unused_element: warning
    dead_code: warning
    avoid_print: warning

linter:
  rules:
    # Logging and error handling (DEST-131).
    avoid_print: true
    empty_catches: true
    # Async safety.
    use_build_context_synchronously: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    # Readability and rebuild cost.
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true
    use_key_in_widget_constructors: true
    # Correctness.
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_relative_lib_imports: true
    avoid_returning_null_for_void: true
    avoid_type_to_string: true
    no_duplicate_case_values: true
    unrelated_type_equality_checks: true
    valid_regexps: true
    test_types_in_equals: true
    throw_in_finally: true
