name: CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: flutter_webrtc_dating_app_v3

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      # Advisory until the codebase gets a one-time `dart format .` commit;
      # then drop continue-on-error.
      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed lib test
      # Errors and warnings fail the build; lint infos are reported only.
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: ${{ env.APP_DIR }}/coverage/lcov.info
          if-no-files-found: ignore

  functions:
    name: Cloud Functions syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          for f in *.js scripts/*.js test/*.js ../test/rules/*.js; do
            node --check "$f"
          done
      # database.rules.json is not checked here: RTDB rules allow comments.
      - name: Validate JSON config
        working-directory: ${{ env.APP_DIR }}
        run: |
          for f in firebase.json firestore.indexes.json \
                   functions/package.json test/rules/package.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - run: npm install --no-audit --no-fund
      - run: npm test

  rules:
    name: Security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1
      - run: npm install -g firebase-tools
      - run: npm --prefix test/rules install --no-audit --no-fund
      - run: npm --prefix test/rules run test:emulators

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Full history with the repo config (.gitleaks.toml allowlists the
      # revoked DEST-007 key in its two historical commits only).
      - name: Scan git history
        run: gitleaks git --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --verbose --no-banner .
      - name: Scan working tree
        run: gitleaks dir --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore --redact --no-banner .
