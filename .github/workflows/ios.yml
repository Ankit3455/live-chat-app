name: iOS build

# Builds an unsigned iOS app (iPhone + iPad) on GitHub's macOS runner and
# uploads it as Destined-unsigned.ipa, to sideload with a free Apple ID
# (Sideloadly / AltStore re-sign it). No App Store, no signing secrets.

on:
  push:
    branches: [main, master, "fix/**", "feature/**", "perf/**"]
    paths:
      - "flutter_webrtc_dating_app_v3/lib/**"
      - "flutter_webrtc_dating_app_v3/ios/**"
      - "flutter_webrtc_dating_app_v3/pubspec.*"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: flutter_webrtc_dating_app_v3

jobs:
  ios:
    name: iOS build (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Build
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          # Annotations are readable without opening the log.
          grep -E "error:|Error:|Exception|failed" build.log | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error::${line}"; done
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Destined-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Destined-unsigned-ipa
          path: ${{ env.APP_DIR }}/Destined-unsigned.ipa
          retention-days: 14
